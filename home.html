<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cadastro</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body id="co">

    <div class="container">


        <div class="logo">

            <h1>CONTA CERTA</h1>

            <p>

                Análise inteligente de contas

                de água e energia

            </p>

        </div>



        <form id="formCadastro" action="#" method="post">


            <h2>Criar conta</h2>


            <label for="nome">

                Nome:

            </label>


            <input

                type="text"

                id="nome"

                placeholder="Digite seu nome"

                required

            >



            <label for="email">

                E-mail:

            </label>


            <input

                type="email"

                id="email"

                placeholder="Digite seu e-mail"

                required

            >



            <label for="senha">

                Senha:

            </label>


            <input

                type="password"

                id="senha"

                placeholder="Mínimo de 6 caracteres"

                minlength="6"

                required

            >



            <label for="idade">

                Idade:

            </label>


            <input

                type="number"

                id="idade"

                placeholder="Digite sua idade"

                min="1"

                max="120"

                required

            >



            <div class="botoes">


                <button

                    type="button"

                    class="cadastrar"

                    onclick="cadastrar()"

                >

                    Cadastrar

                </button>



                <button

                    type="reset"

                    class="limpar"

                >

                    Limpar

                </button>


            </div>


        </form>



        <p id="mensagem"></p>


    </div>
<a href="index.html">Clique aqui</a>

</body>
</html>
